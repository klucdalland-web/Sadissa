<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Créez votre compte Sadissa pour lancer une campagne ou soutenir des projets." />
    <title>Inscription | Sadissa</title>
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/layout.css" />
    <link rel="stylesheet" href="../assets/css/pages/auth.css" />
</head>

<body>
    <main id="app" class="auth">
        <span class="auth__blob auth__blob--1" aria-hidden="true"></span>
        <span class="auth__blob auth__blob--2" aria-hidden="true"></span>

        <div class="auth__panel auth__panel--wide">
            <div class="auth__brand">
                <img class="auth__logo" src="../assets/img/logo.png" alt="Sadissa" />
                <h1 class="auth__title">Créer un compte</h1>
                <p class="auth__subtitle">
                    Rejoignez Sadissa pour donner vie aux projets qui comptent.
                </p>
            </div>

            <form class="auth-form" id="register-form" novalidate>
                <div class="auth-form__alert auth-form__alert--error" id="register-alert" role="alert"></div>

                <div class="auth-form__row">
                    <div class="auth-field">
                        <label class="auth-field__label" for="register-firstname">Prénom</label>
                        <input class="auth-field__control" id="register-firstname" name="firstname" type="text"
                               autocomplete="given-name" placeholder="Votre prénom" required />
                        <p class="auth-field__error" data-error-for="firstname"></p>
                    </div>

                    <div class="auth-field">
                        <label class="auth-field__label" for="register-lastname">Nom</label>
                        <input class="auth-field__control" id="register-lastname" name="lastname" type="text"
                               autocomplete="family-name" placeholder="Votre nom" required />
                        <p class="auth-field__error" data-error-for="lastname"></p>
                    </div>
                </div>

                <div class="auth-field">
                    <label class="auth-field__label" for="register-email">Adresse e-mail</label>
                    <input class="auth-field__control" id="register-email" name="email" type="email"
                           autocomplete="email" placeholder="vous@exemple.com" required />
                    <p class="auth-field__error" data-error-for="email"></p>
                </div>

                <div class="auth-form__row">
                    <div class="auth-field">
                        <label class="auth-field__label" for="register-type-piece">Type de pièce</label>
                        <select class="auth-field__control" id="register-type-piece" name="type_piece_id" required>
                            <option value="" disabled selected>Choisir…</option>
                        </select>
                        <p class="auth-field__error" data-error-for="type_piece_id"></p>
                    </div>

                    <div class="auth-field">
                        <label class="auth-field__label" for="register-number-piece">Numéro de pièce</label>
                        <input class="auth-field__control" id="register-number-piece" name="number_piece" type="text"
                               autocomplete="off" placeholder="Ex. A1234567" required />
                        <p class="auth-field__error" data-error-for="number_piece"></p>
                    </div>
                </div>

                <div class="auth-field">
                    <label class="auth-field__label" for="register-password">Mot de passe</label>
                    <div class="auth-field__password">
                        <input class="auth-field__control" id="register-password" name="password" type="password"
                               autocomplete="new-password" placeholder="8 caractères minimum" required minlength="8" />
                        <button class="auth-field__toggle" type="button" data-toggle-password="register-password"
                                aria-label="Afficher le mot de passe">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                    <p class="auth-field__hint">Au moins 8 caractères.</p>
                    <p class="auth-field__error" data-error-for="password"></p>
                </div>

                <div class="auth-field">
                    <label class="auth-field__label" for="register-password-confirm">Confirmer le mot de passe</label>
                    <div class="auth-field__password">
                        <input class="auth-field__control" id="register-password-confirm"
                               name="password_confirmation" type="password" autocomplete="new-password"
                               placeholder="Retapez votre mot de passe" required minlength="8" />
                        <button class="auth-field__toggle" type="button"
                                data-toggle-password="register-password-confirm"
                                aria-label="Afficher le mot de passe">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                    <p class="auth-field__error" data-error-for="password_confirmation"></p>
                </div>

                <button class="btn btn--primary auth-form__submit" type="submit" id="register-submit">
                    Créer mon compte
                </button>
            </form>

            <p class="auth__switch">
                Déjà un compte ?
                <a href="login.html">Se connecter</a>
            </p>
        </div>
    </main>

    <script type="module" src="../assets/js/main.js"></script>
    <script type="module" src="../assets/js/pages/register.js"></script>
</body>

</html>
